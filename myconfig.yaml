  - name: "🎮 游戏平台"
    type: select
    proxies:
      - "DIRECT"
      - "🚀 节点选择"
      - "🇭🇰 香港节点"
      - "🇺🇸 美国节点"
      - "🇹🇼 台湾节点"
      - "🇸🇬 狮城节点"
      - "🇯🇵 日本节点"
      - "🇰🇷 韩国节点"
      - "🌍 其他节点"
      - "🚀 手动切换"

  - name: "🎯 全球直连"
    type: select
    proxies:
      - "DIRECT"
      - "🚀 节点选择"
      - "🚀 手动切换"

  - name: "🛑 广告拦截"
    type: select
    proxies:
      - "REJECT"
      - "DIRECT"

  - name: "🇭🇰 香港节点"
    type: select
    include-all: true
    filter: "(🇭🇰|\\.hk|HK|香港|港)"

  - name: "🇺🇸 美国节点"
    type: select
    include-all: true
    filter: "(🇺🇸|\\.us|US|美国|美)"

  - name: "🇹🇼 台湾节点"
    type: select
    include-all: true
    filter: "(🇹🇼|\\.tw|TW|台湾|台)"

  - name: "🇸🇬 狮城节点"
    type: select
    include-all: true
    filter: "(🇸🇬|\\.sg|SG|新加坡|狮城|坡)"

  - name: "🇯🇵 日本节点"
    type: select
    include-all: true
    filter: "(🇯🇵|\\.jp|JP|日本|日)"

  - name: "🇰🇷 韩国节点"
    type: select
    include-all: true
    filter: "(🇰🇷|\\.kr|KR|韩国|韩)"

  - name: "🌍 其他节点"
    type: select
    include-all: true
    filter: "^(?!.*(🇭🇰|\\.hk|HK|香港|港|🇺🇸|\\.us|US|美国|美|🇹🇼|\\.tw|TW|台湾|台|🇸🇬|\\.sg|SG|新加坡|狮城|坡|🇯🇵|\\.jp|JP|日本|日|🇰🇷|\\.kr|KR|韩国|韩)).*$"

  - name: "🚀 手动切换"
    type: select
    include-all: true

